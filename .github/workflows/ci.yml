name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: gofmt -l . | tee /dev/stderr | (! read) || (echo "run gofmt -w ." && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
